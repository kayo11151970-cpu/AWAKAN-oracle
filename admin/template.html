<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>AWAKEN 会員管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#e3eadc,transparent 70%),#f8f9f4;color:#344c43;font-family:'Yu Mincho','Hiragino Mincho ProN',serif;padding:28px 16px;min-height:100svh}main{max-width:620px;margin:auto;background:#ffffff80;border:1px solid #a58a5140;border-radius:12px;padding:30px 24px}header{font:24px Georgia,serif;letter-spacing:5px}h1{font-size:22px;font-weight:400;margin:24px 0}h2{font-size:17px;font-weight:400;overflow-wrap:anywhere}p,dt,dd,label{font-size:14px;line-height:1.9}p{color:#61705f}input{width:100%;min-height:48px;border:1px solid #a58a5170;background:#fffdf8;border-radius:3px;padding:12px;font-size:16px;color:#344c43}button{min-height:48px;padding:13px 18px;border:1px solid #a58a5170;border-radius:3px;background:linear-gradient(120deg,#a68c53,#89713e);color:#fffdf3;font:15px serif;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #344c43;outline-offset:3px}a{color:#816b3d;line-height:2}dt{color:#816b3d;margin-top:15px}dd{margin:2px 0;overflow-wrap:anywhere}.actions{border-top:1px solid #a58a5140;padding-top:12px;margin-top:24px}#end-month{background:#f8f6ed;color:#7d6037}#customer{border-top:1px solid #a58a5140;padding-top:12px;margin-top:24px}#message{min-height:48px}small{display:block;line-height:1.8;color:#61705f;margin-top:16px}[hidden]{display:none!important}@media(max-width:350px){main{padding:24px 16px}}
</style></head><body><main><header>AWAKEN</header><h1>会員管理</h1><div id="gate"><p id="gate-message" role="status">管理権限を確認しています…</p><a href="../">AWAKENでログインする</a></div><section id="manager" hidden><p>入金を確認したお客様のメールアドレスを入力してください。</p><form id="lookup"><label for="customer-email">お客様のメールアドレス</label><input id="customer-email" type="email" autocomplete="off" required><button id="search" type="submit">登録情報を確認する</button></form><p id="message" role="status" aria-live="polite"></p><section id="customer" hidden><h2 id="result-email"></h2><dl><dt>現在の状態</dt><dd id="member-state"></dd><dt>メール確認</dt><dd id="email-confirmed"></dd><dt>次に引ける日時</dt><dd id="next-draw"></dd><dt>前回引いた日時</dt><dd id="last-draw"></dd><dt>会員終了の予約</dt><dd id="end-date"></dd></dl><div class="actions"><button id="activate" type="button" disabled>会員にする</button><button id="end-month" type="button" disabled>月末で終了</button><small>有効な会員に繰り返し「会員にする」を押しても、引ける回数は増えません。月末終了を予約した後も、月末までは7日間隔で利用できます。</small></div></section><p><a href="../">AWAKENに戻る</a></p></section></main><script>/* ADMIN_RUNTIME */</script></body></html>
