// Rejection sampling keeps all 44 outcomes equally likely.
function drawNumber(){
 const limit=Math.floor(4294967296/44)*44;
 const values=new Uint32Array(1);
 do{crypto.getRandomValues(values);}while(values[0]>=limit);
 return values[0]%44+1;
}

  const image=new Image();image.src=cardImages[number-1];
